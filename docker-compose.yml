services:
  app:
    build: .
    image: multimodalagent-agent:0.1.0
    container_name: multimodalagent-agent
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/multimodalAgent?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: multimodalAgent
      DB_PASSWORD: multimodalAgent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mindbridge-qwen2.5-7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      OLLAMA_RERANK_MODEL: ${OLLAMA_RERANK_MODEL:-}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-true}
      AGENT_CHAT_MIGRATION_ENABLED: ${AGENT_CHAT_MIGRATION_ENABLED:-true}
      AGENT_MEMORY_ENABLED: ${AGENT_MEMORY_ENABLED:-true}
      AGENT_SKILLS_ENABLED: ${AGENT_SKILLS_ENABLED:-true}
      RAG_HYBRID_MVP_ENABLED: ${RAG_HYBRID_MVP_ENABLED:-true}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-HYBRID_RRF}
      USE_CHROMA: ${USE_CHROMA:-false}
      CHROMA_BASE_URL: http://chroma:8000
      H2_CONSOLE_ENABLED: "false"
      MCP_EXCEL_MODE: ${MCP_EXCEL_MODE:-local}
      MCP_EMAIL_MODE: ${MCP_EMAIL_MODE:-log}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  mysql:
    image: mysql:8.4
    container_name: multimodalagent-mysql
    environment:
      MYSQL_DATABASE: multimodalAgent
      MYSQL_USER: multimodalAgent
      MYSQL_PASSWORD: multimodalAgent
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umultimodalAgent -pmultimodalAgent --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: multimodalagent-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chroma:
    image: chromadb/chroma:latest
    container_name: multimodalagent-chroma
    profiles: ["legacy-chroma"]
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

  mailpit:
    image: axllent/mailpit:latest
    container_name: multimodalagent-mailpit
    profiles: ["smtp-demo"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
  chroma-data:
